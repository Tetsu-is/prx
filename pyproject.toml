[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prx"
version = "0.1.0"
description = "Run Codex CLI through a local LiteLLM GitHub Copilot proxy."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "prx contributors" }]
dependencies = [
  "httpx>=0.28.1,<0.29",
  "litellm[proxy]==1.94.1",
  "platformdirs>=4.3.8,<5",
  "typer>=0.16.0,<1",
]

[project.scripts]
prx = "prx.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17.0,<2",
  "pytest>=8.4.0,<9",
  "pytest-cov>=6.2.0,<7",
  "ruff>=0.12.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prx"]

[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
testpaths = ["tests"]
markers = [
  "integration: requires permission to bind a loopback TCP port",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["prx"]
